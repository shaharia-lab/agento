repos:
  # ── General hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The email skeleton is a frozen artifact, asserted byte for byte against
      # the golden in parity/. Its trailing whitespace is load-bearing — the
      # spaces either side of six elided HTML comments — so stripping it
      # silently changes the mail the app sends. Byte-exact is the point of the
      # file, and nothing can regenerate it.
      - id: trailing-whitespace
        exclude: ^src-tauri/src/native/notifications/email\.html$
      - id: end-of-file-fixer
        exclude: ^src-tauri/src/native/notifications/email\.html$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: no-commit-to-branch
        name: no-push-to-main
        args: [--branch, main]
        stages: [pre-push]

# The real checks live in `.github/workflows/ci.yml`: `cargo fmt --check`,
# `cargo clippy -D warnings`, `cargo test`, and `npm run build` (which
# typechecks). They are deliberately not mirrored here — a `cargo clippy
# --all-targets` on every commit is a minute-plus, and CI is where the gate
# belongs.
