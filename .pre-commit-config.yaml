repos:
  # ── General hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The email skeleton is generated: it is what Go's `html/template`
      # *rendered* from `internal/notification/template.go`, and the
      # notification port is asserted against a golden Go wrote — now frozen in
      # parity/, since #388 deleted the generator. Its trailing whitespace is
      # Go's — the spaces either side of the six HTML comments html/template
      # elides — so stripping it silently changes the mail the app sends.
      # Byte-exact is the point of the file, and nothing can regenerate it.
      - id: trailing-whitespace
        exclude: ^src-tauri/src/native/notifications/email\.html$
      - id: end-of-file-fixer
        exclude: ^src-tauri/src/native/notifications/email\.html$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: no-commit-to-branch
        name: no-push-to-main
        args: [--branch, main]
        stages: [pre-push]

# The Go and web hooks went with the trees they checked (#388): golangci-lint
# over `internal/`, and the four `frontend/`-scoped node hooks. All four were
# scoped to `^frontend/src/`, so none of them ever fired on desktop work — this
# removes dead configuration rather than lowering the bar on anything.
#
# Desktop checks live in `.github/workflows/desktop-ci.yml`: `cargo fmt
# --check`, `cargo clippy -D warnings`, `cargo test`, and `npm run build`
# (which typechecks). They are deliberately not mirrored here — a `cargo
# clippy --all-targets` on every commit is a minute-plus, and CI is where the
# gate belongs.
