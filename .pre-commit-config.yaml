repos:
  # ── General hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The email skeleton is generated: it is what `html/template` *renders*
      # from internal/notification/template.go, and the notification port is
      # asserted against a golden Go wrote. Its trailing whitespace is Go's —
      # the spaces either side of the six HTML comments html/template elides —
      # so stripping it silently makes the desktop app send different mail from
      # the server. Byte-exact is the point of the file.
      - id: trailing-whitespace
        exclude: ^desktop/src-tauri/src/native/notifications/email\.html$
      - id: end-of-file-fixer
        exclude: ^desktop/src-tauri/src/native/notifications/email\.html$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: no-commit-to-branch
        name: no-push-to-main
        args: [--branch, main]
        stages: [pre-push]

  # ── Go — golangci-lint ───────────────────────────────────────────────────────
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: golangci-lint
        args: [--config=.golangci.yml]

  # ── Frontend — ESLint ────────────────────────────────────────────────────────
  - repo: local
    hooks:
      - id: frontend-eslint
        name: Frontend ESLint
        language: node
        entry: sh -c 'cd frontend && npm run lint'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      # ── Frontend — Prettier ──────────────────────────────────────────────────
      - id: frontend-prettier
        name: Frontend Prettier
        language: node
        entry: sh -c 'cd frontend && npm run format:check'
        files: ^frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: false

      # ── Frontend — TypeScript type check ────────────────────────────────────
      - id: frontend-typecheck
        name: Frontend TypeScript type check
        language: node
        entry: sh -c 'cd frontend && npm run typecheck'
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false

      # ── Frontend — Production build ──────────────────────────────────────────
      - id: frontend-build
        name: Frontend build
        language: node
        entry: sh -c 'cd frontend && npm run build'
        files: ^frontend/src/.*\.(ts|tsx|css)$
        pass_filenames: false
