<!doctype html>
<!--
  The animated walkthrough embedded in the "Credentials Checker" post.

  Every frame is a real screenshot of the app, taken over a synthetic corpus
  (.claude/skills/app-demo-ui-screenshot) with invented keys planted in it, so
  nothing on screen belongs to anyone. Only the cursor, the click ripples and
  the captions are drawn here. Coordinates in BEATS are pixels of the 1280×820
  screenshots; the stage scales as a whole, so they hold at any embed width.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Credentials Checker walkthrough</title>
    <style>
      :root { --paper: #f0eee6; --ink: #0b0c07; --accent: #1f7a4c; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: var(--paper); overflow: hidden; }
      body { font: 600 15px/1.3 Karla, system-ui, sans-serif; color: var(--ink); }

      /* The embed fixes an aspect ratio, so the stage takes whichever of the
         width or the height left under the caption is tighter. */
      .wrap { margin: 0 auto; }
      .cap {
        display: flex; align-items: center; gap: 10px;
        height: 44px; padding: 0 4px;
      }
      .cap__n {
        flex: none; width: 26px; height: 26px; border-radius: 50%;
        border: 2px solid var(--ink); background: var(--accent); color: var(--paper);
        display: grid; place-items: center; font-size: 13px;
      }
      .cap__t { font-size: clamp(12px, 3.4vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .dots { margin-left: auto; display: flex; gap: 6px; }
      .dots i { width: 8px; height: 8px; border-radius: 50%; border: 2px solid var(--ink); }
      .dots i.on { background: var(--ink); }
      @media (max-width: 480px) { .dots { display: none; } }

      /* The stage is laid out at the screenshots' own 1280×820 and scaled to
         fit, so every coordinate below is a screenshot pixel. */
      .viewport {
        position: relative; width: 100%; height: calc(1px * var(--h));
        border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff;
      }
      .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 820px; transform-origin: 0 0; }
      .frame { position: absolute; inset: 0; width: 1280px; height: 820px; opacity: 0; transition: opacity 0.35s; }
      .frame.on { opacity: 1; }

      .cursor {
        position: absolute; left: 0; top: 0; width: 26px; height: 34px; z-index: 5;
        transition: transform 0.9s cubic-bezier(0.45, 0, 0.2, 1);
        filter: drop-shadow(1px 2px 1px rgba(0, 0, 0, 0.35));
      }
      .ripple {
        position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px; z-index: 4;
        border-radius: 50%; border: 4px solid var(--accent); opacity: 0; pointer-events: none;
      }
      .ripple.go { animation: ripple 0.6s ease-out; }
      @keyframes ripple {
        from { transform: scale(0.3); opacity: 1; }
        to { transform: scale(1.4); opacity: 0; }
      }
      .ring {
        position: absolute; z-index: 3; border: 4px solid var(--accent); border-radius: 8px;
        opacity: 0; transition: opacity 0.4s; pointer-events: none;
      }
      .ring.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="cap">
        <span class="cap__n" id="n">1</span>
        <span class="cap__t" id="t"></span>
        <span class="dots" id="dots"><i></i><i></i><i></i><i></i></span>
      </div>
      <div class="viewport" id="vp">
        <div class="stage" id="stage">
          <img class="frame" src="1-security-off.webp" alt="Settings, Security tab, with the Credentials Checker switched off" />
          <img class="frame" src="2-security-on.webp" alt="The Credentials Checker switched on, with unsaved changes" />
          <img class="frame" src="3-security-saved.webp" alt="Settings saved with the Credentials Checker on" />
          <img class="frame" src="4-findings.webp" alt="The Credentials Checker page listing ten findings grouped by session, each key masked" />
          <img class="frame" src="5-menu.webp" alt="The right-click menu on a finding: mark as false positive, whitelist this value, whitelist this rule" />
          <img class="frame" src="6-fp.webp" alt="The JWT finding now marked as a false positive" />
          <div class="ring" id="ring"></div>
          <div class="ripple" id="ripple"></div>
          <svg class="cursor" id="cursor" viewBox="0 0 26 34" aria-hidden="true">
            <path d="M2 2 L2 27 L8.5 21 L13 31.5 L17.5 29.5 L13 19.5 L22 19.5 Z" fill="#fff" stroke="#0b0c07" stroke-width="2.2" stroke-linejoin="round" />
          </svg>
        </div>
      </div>
    </div>

    <script>
      const CAPS = [
        'Open Settings → Security',
        'Switch the checker on and save',
        'Leaked keys, masked, by session',
        'Mark a false positive or whitelist it',
      ];

      // Each beat moves the cursor to (x, y) in the current frame; on arrival a
      // click ripples and the frame named by `next` replaces it, the way the app
      // answered that click when the screenshots were taken.
      // [caption, x, y, click, next frame | null, ring [x, y, w, h] | null, hold ms]
      const BEATS = [
        [0, 640, 520, false, null, null, 500],
        [0, 904, 58, true, null, null, 700],
        [1, 830, 274, true, 1, [241, 232, 620, 80], 1000],
        [1, 823, 768, true, 2, null, 1300],
        [2, 104, 648, true, 3, null, 200],
        [2, 700, 400, false, null, [555, 107, 478, 562], 3400],
        [3, 300, 594, true, 4, null, 1100],
        [3, 462, 610, true, 5, null, 300],
        [3, 1195, 594, false, null, [1142, 580, 116, 30], 3400],
      ];

      const $ = (id) => document.getElementById(id);
      const frames = [...document.querySelectorAll('.frame')];
      const dots = [...$('dots').children];
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const wait = (ms) => new Promise((ok) => setTimeout(ok, ms));

      function fit() {
        const k = Math.min((innerWidth - 4) / 1280, (innerHeight - 48) / 820);
        document.querySelector('.wrap').style.width = 1280 * k + 4 + 'px';
        $('vp').style.setProperty('--h', 820 * k + 4);
        $('stage').style.transform = `scale(${k})`;
      }
      addEventListener('resize', fit);
      fit();

      const frame = (n) => frames.forEach((f, i) => f.classList.toggle('on', i === n));
      function caption(n) {
        $('n').textContent = n + 1;
        $('t').textContent = CAPS[n];
        dots.forEach((d, i) => d.classList.toggle('on', i === n));
      }
      function ring(r) {
        const el = $('ring');
        if (r) Object.assign(el.style, { left: r[0] + 'px', top: r[1] + 'px', width: r[2] + 'px', height: r[3] + 'px' });
        el.classList.toggle('on', !!r);
      }
      function ripple(x, y) {
        const p = $('ripple');
        Object.assign(p.style, { left: x + 'px', top: y + 'px' });
        p.classList.remove('go');
        void p.offsetWidth;
        p.classList.add('go');
      }

      if (reduce) {
        // One still frame that carries the point: the findings list.
        frame(3);
        caption(2);
        $('cursor').style.display = 'none';
      } else {
        (async () => {
          for (;;) {
            frame(0);
            ring(null);
            for (const [cap, x, y, click, next, r, hold] of BEATS) {
              caption(cap);
              ring(null);
              $('cursor').style.transform = `translate(${x}px, ${y}px)`;
              await wait(950);
              if (click) {
                ripple(x, y);
                await wait(250);
                if (next !== null) frame(next);
              }
              ring(r);
              await wait(hold);
            }
            ring(null);
            await wait(600);
          }
        })();
      }
    </script>
  </body>
</html>
