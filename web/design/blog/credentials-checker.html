<!doctype html>
<!--
  Source for public/blog/credentials-checker.png, the banner and share card of
  the "Credentials Checker" post. Rendered at 1200×630 like design/og-image.html,
  and under the same two rules: no text, and everything that means anything
  inside the centre 600×600. Re-render after editing:

      npm run build:og -- design/blog/credentials-checker.html public/blog/credentials-checker.png

  The picture: a chat transcript whose lines are ink bars, one of them a leaked
  key (red), caught under a lens that shows it masked, with the green shield of
  the check beside it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --paper: #f0eee6;
        --ink: #0b0c07;
        --accent: #1f7a4c;
        --faint: #d8d5c9;
        --line: #bdb9ab;
        --leak: #c2412d;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body { background: var(--paper); overflow: hidden; position: relative; }
      .grid {
        position: absolute; inset: 0;
        background-image:
          linear-gradient(to right, var(--faint) 1.5px, transparent 1.5px),
          linear-gradient(to bottom, var(--faint) 1.5px, transparent 1.5px);
        background-size: 60px 60px;
        background-position: -1px -1px;
      }
      .stage { position: absolute; left: 300px; top: 15px; width: 600px; height: 600px; }

      /* The transcript: two back cards for "many sessions", one front card. */
      .card {
        position: absolute; width: 340px; height: 420px;
        background: var(--paper); border: 6px solid var(--ink); border-radius: 18px;
      }
      .card--back2 { left: 70px; top: 70px; box-shadow: 12px 12px 0 var(--ink); }
      .card--back1 { left: 50px; top: 100px; }
      .card--front { left: 30px; top: 130px; box-shadow: 14px 14px 0 var(--ink); padding: 34px 30px; display: flex; flex-direction: column; gap: 20px; }
      .row { display: flex; gap: 12px; align-items: center; }
      .row--me { justify-content: flex-end; }
      .dot { width: 26px; height: 26px; border-radius: 50%; border: 5px solid var(--ink); flex: none; }
      .dot--ai { background: var(--accent); }
      .dot--me { background: var(--paper); }
      .bar { height: 18px; border-radius: 9px; background: var(--line); }
      .bar--leak { background: var(--leak); border: 4px solid var(--ink); height: 24px; border-radius: 12px; }

      /* The lens, over the leaked line, showing it masked. */
      .lens {
        position: absolute; left: 250px; top: 150px; width: 250px; height: 250px;
        border-radius: 50%; border: 14px solid var(--ink); background: #fbfaf5;
        box-shadow: 14px 14px 0 var(--ink);
        display: flex; align-items: center; justify-content: center; gap: 12px;
      }
      .lens .m { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); }
      .lens .m--red { background: var(--leak); }
      .handle {
        position: absolute; left: 455px; top: 370px; width: 44px; height: 150px;
        background: var(--ink); border-radius: 22px; transform: rotate(-45deg); transform-origin: top center;
      }

      /* The shield: the check found it, and you are covered. */
      .shield { position: absolute; left: 440px; top: 40px; width: 130px; height: 150px; }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="stage">
      <div class="card card--back2"></div>
      <div class="card card--back1"></div>
      <div class="card card--front">
        <div class="row"><div class="dot dot--ai"></div><div class="bar" style="width: 190px"></div></div>
        <div class="row" style="padding-left: 38px"><div class="bar" style="width: 140px"></div></div>
        <div class="row row--me"><div class="bar" style="width: 150px"></div><div class="dot dot--me"></div></div>
        <div class="row"><div class="dot dot--ai"></div><div class="bar" style="width: 90px"></div><div class="bar bar--leak" style="width: 110px"></div></div>
        <div class="row" style="padding-left: 38px"><div class="bar" style="width: 170px"></div></div>
        <div class="row row--me"><div class="bar" style="width: 120px"></div><div class="dot dot--me"></div></div>
        <div class="row"><div class="dot dot--ai"></div><div class="bar" style="width: 160px"></div></div>
      </div>

      <div class="handle"></div>
      <div class="lens">
        <div class="m"></div><div class="m"></div><div class="m m--red"></div><div class="m"></div><div class="m"></div>
      </div>

      <svg class="shield" viewBox="0 0 130 150" xmlns="http://www.w3.org/2000/svg">
        <path d="M17 17 L65 5 L113 17 L113 70 C113 108 90 130 65 143 C40 130 17 108 17 70 Z" fill="#0b0c07" transform="translate(9 9)"/>
        <path d="M17 17 L65 5 L113 17 L113 70 C113 108 90 130 65 143 C40 130 17 108 17 70 Z" fill="#1f7a4c" stroke="#0b0c07" stroke-width="8" stroke-linejoin="round"/>
        <path d="M42 74 L59 91 L90 56" fill="none" stroke="#f0eee6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </body>
</html>
