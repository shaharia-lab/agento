[package]
name = "agento"
version = "0.1.0"
description = "Personal AI agent platform for Claude Code"
authors = ["Shaharia Lab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Local reverse proxy in front of the Go sidecar. No TLS backend: every hop is
# loopback, and pulling in rustls here would cost build time for nothing.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

# Release builds serve the frontend from the proxy so the page is same-origin
# with the API.
rust-embed = "8"
mime_guess = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"

# Ported endpoints (phase 2 onward) read the same SQLite file the Go server
# owns. `bundled` compiles SQLite from source rather than linking the system
# library: Windows has none, and every release target builds on its own native
# runner, so there is no C cross-toolchain to arrange.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Effective-dated rates are timestamps, and their wire format has to match Go's
# byte for byte. `clock` is only for "which rate is in force now".
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
