[package]
name = "agento"
version = "0.1.0"
description = "Personal AI agent platform for Claude Code"
authors = ["Shaharia Lab"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "agento_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
# `float_roundtrip` is not optional here. Without it serde_json's float parser
# is not bit-exact: `0.36238800000000004` in a stored JSON column decodes to a
# *different* double, which re-encodes as `0.362388` and breaks byte parity
# with Go on any endpoint that reads one (per-model costs today, analytics
# next). Rust's own `str::parse` was always correct; only serde_json's fast
# path was not.
#
# `raw_value` is likewise load-bearing. A chat message's `tool_use` block stores
# its arguments as a Go `json.RawMessage`, which Go re-emits through `compact` —
# preserving the stored key order and number spelling. Decoding that into a
# `serde_json::Value` and re-encoding would sort the keys and respell the
# numbers (`{"z":1.50,"a":1}` → `{"a":1,"z":1.5}`), so the value is carried as a
# `RawValue` and written back as a raw fragment.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
log = "0.4"

# Local reverse proxy in front of the Go sidecar. No TLS backend: every hop is
# loopback, and pulling in rustls here would cost build time for nothing.
axum = "0.8"
# `process` and `io-util` are for the Claude Agent SDK port (`src/claude/`),
# which spawns the `claude` CLI and reads its stdout line by line. The sidecar
# goes through tauri-plugin-shell instead, but that only launches binaries
# declared as Tauri sidecars — the agent CLI is an arbitrary executable resolved
# on PATH, so it needs a real process API.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "process",
    "io-util",
    "io-std",
    "sync",
] }
reqwest = { version = "0.12", default-features = false, features = ["stream"] }

# Control requests are correlated by a v4 UUID, and hook callbacks are
# registered under one. Go generates them from crypto/rand by hand; the format
# on the wire is the standard lowercase hyphenated one either way.
uuid = { version = "1", features = ["v4"] }

# Release builds serve the frontend from the proxy so the page is same-origin
# with the API.
rust-embed = "8"
mime_guess = "2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.0.0-rc.4"
tauri-plugin-process = "2.0.0-rc.1"

# Ported endpoints (phase 2 onward) read the same SQLite file the Go server
# owns. `bundled` compiles SQLite from source rather than linking the system
# library: Windows has none, and every release target builds on its own native
# runner, so there is no C cross-toolchain to arrange.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Effective-dated rates are timestamps, and their wire format has to match Go's
# byte for byte. `clock` is only for "which rate is in force now".
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
# Analytics buckets days, hours and weekdays in the *request's* timezone, so an
# IANA name has to resolve to real offsets and real DST transitions. Go reaches
# its own embedded tzdata through `time.LoadLocation`; this is the equivalent.
chrono-tz = "0.10"
form_urlencoded = "1.2.2"

# Graceful shutdown of the `claude` subprocess is close stdin → SIGTERM →
# SIGKILL after 5s, mirroring the TypeScript SDK's close(). Tokio's own
# `Child::kill` is SIGKILL only, so the SIGTERM step needs raw kill(2).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
