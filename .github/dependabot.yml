version: 2
updates:
  # Rust: the app's backend. Patch updates only, single grouped PR.
  #
  # This entry replaces the `gomod` one, which pointed at a `go.mod` deleted
  # with the Go server (#391) and had been resolving to nothing since. Cargo
  # went uncovered for that whole period — the backend is Rust, so this is the
  # entry that actually keeps it current.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      backend:
        patterns:
          - "*"

  # Frontend: npm packages — patch updates only, single grouped PR.
  #
  # `/`, not `/frontend`: the app moved to the repository root (#392) and the
  # old path stopped matching anything.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    # typescript-eslint does not support TS 7 yet; eslint-plugin-react-hooks 7.1
    # introduces stricter rules that need a dedicated cleanup pass
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1.0"]
    groups:
      frontend:
        patterns:
          - "*"

  # GitHub Actions — single grouped PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
