version: 2
updates:
  # Backend: Go modules — single grouped PR, max 1 open at a time
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      backend:
        patterns:
          - "*"

  # Frontend: npm packages — single grouped PR, max 1 open at a time
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    # typescript-eslint does not support TS 7 yet; eslint-plugin-react-hooks 7.1
    # introduces stricter rules that need a dedicated cleanup pass
    ignore:
      - dependency-name: typescript
        versions: [">=7.0.0"]
      - dependency-name: eslint-plugin-react-hooks
        versions: [">=7.1.0"]
    groups:
      frontend:
        patterns:
          - "*"

  # GitHub Actions — single grouped PR
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
