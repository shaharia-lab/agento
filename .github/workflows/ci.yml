name: CI

# Checks for Agento. The app is the whole repository, so there is no path
# filter to write — an unfiltered trigger is the right default when there is
# no such thing as a change that cannot affect the app.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Every step here reads the checkout and writes nothing back — no comment, no
# release, no package, no check run of its own. Without this block the job runs
# with whatever the repository default is, which for a public repo can still be
# the read/write token; a workflow that only ever needs `contents: read` should
# say so rather than inherit a wider one. `release.yml` declares its own, wider
# set for the same reason.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-22.04
    # A hung step otherwise runs until GitHub's 6-hour cap: apt has stalled on
    # a dead mirror socket twice (56 min and 3h42m of silence after
    # "Get:5 ... jammy-security InRelease"), burning runner time and blocking
    # the PR with a check that will never report.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Runs before the expensive steps because it costs milliseconds and its
      # failure is unambiguous.
      #
      # The release workflow's guard checks these against the **tag**, which is
      # the authoritative check — but it only fires at tag time, when a
      # mismatch means deleting a tag and cutting the release again. This one
      # asks the cheaper question on every PR: do the four strings agree with
      # *each other*? That catches the drift while it is still an edit.
      #
      # It exists because `package-lock.json` sat on 0.1.1 for the whole of
      # 0.1.2 with CI green throughout. Nothing looked at it, and the symptom
      # surfaced as an unexplained dirty working tree: npm repairs that field
      # on almost any command, so every fresh checkout went dirty on the first
      # `npm run build` with a change nobody made.
      - name: Version strings agree
        run: |
          conf="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          pkg="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          lock="$(python3 -c 'import json; print(json.load(open("package-lock.json"))["version"])')"
          lock_pkg="$(python3 -c 'import json; print(json.load(open("package-lock.json"))["packages"][""]["version"])')"
          # grep rather than a TOML parser: `tomllib` is Python 3.11 and this
          # runner is 3.10. `[package]` opens the file, so the first `version =`
          # is the crate's own and not a dependency's.
          cargo_toml="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"

          if [ "$conf" = "$pkg" ] && [ "$conf" = "$lock" ] && [ "$conf" = "$lock_pkg" ] \
             && [ "$conf" = "$cargo_toml" ]; then
            echo "ok: ${conf}"
            exit 0
          fi

          echo "::error::version strings disagree — tauri.conf.json=${conf} package.json=${pkg} package-lock.json=${lock} package-lock.json .packages['']=${lock_pkg} src-tauri/Cargo.toml=${cargo_toml}. Fix with: npm version ${conf} --no-git-tag-version (package.json + lockfile), and set src-tauri/tauri.conf.json and src-tauri/Cargo.toml by hand (then \`cargo update -p agento --offline\` for Cargo.lock). See docs/releasing.md step 1."
          exit 1

      - name: Install Linux build dependencies
        # Azure's mirror regularly fails over to archive.ubuntu.com, and a
        # stalled fetch there is the hang the timeouts above exist for — so
        # give apt its own tight deadline and per-request timeouts + retries,
        # which turn a dead mirror into a fast, retryable failure.
        timeout-minutes: 10
        run: |
          # When the Azure mirror is fully down, per-request timeouts alone
          # still blow the step deadline: 30s x 3 retries x dozens of index
          # files. Drop it from the mirror list so apt never contacts it.
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com|https://archive.ubuntu.com|g; s|https?://azure\.ports\.ubuntu\.com|http://ports.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential file

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Covers every endpoint, including the frozen goldens in parity/. This is
      # their only reader, so a change to one of those files is only ever
      # noticed here — see parity/README.md before editing any of them.
      #
      # `cargo test` and not `cargo nextest run`, and that was measured rather
      # than assumed (#449). nextest does run the 14 test binaries as parallel
      # processes and it does win there — 37-41s against `cargo test`'s ~59s of
      # strictly sequential execution. But nextest cannot run doctests, so the
      # step becomes two cargo invocations, and the second one's compile phase
      # does not overlap the first's the way a single `cargo test` overlaps
      # building the doctest lib with building the test binaries. That costs
      # ~40s, more than the ~20s parallelism saves: three consecutive runs
      # measured the split step at 155s against this one's 130-162s, and
      # reversing the order of the two commands changed nothing (155s again).
      # If you revisit it, the thing to beat is the serialized second compile,
      # not the execution time.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # A full `tauri build` here would double CI time; compiling a
      # release-derived profile is what actually catches the
      # `cfg(not(debug_assertions))` code that never builds during development.
      #
      # `ci` rather than `release`, and the difference is the point: that goal
      # is a *compilation* property — `cfg(debug_assertions)` keys off the
      # profile's `debug-assertions` flag, which `[profile.ci]` inherits — while
      # `lto = true` + `codegen-units = 1` spend ~4 minutes re-optimizing all
      # 594 crates' bitcode as one largely single-threaded unit, for a binary
      # this job throws away. The installers users actually install are built by
      # release.yml through `tauri build`, which uses `--release` and so cannot
      # reach this profile. See `[profile.ci]` in src-tauri/Cargo.toml.
      - name: Compile Rust (ci profile)
        working-directory: src-tauri
        run: cargo build --profile ci

  # Windows x86_64 is a shipped release target (`release.yml` builds
  # `x86_64-pc-windows-msvc`) and nothing compiled the `cfg(windows)` arms until
  # #374 ported Go's Windows `filepath`. Without this job that port is
  # unverified on the only platform it targets: `cfg(not(windows))` code
  # compiles everywhere and the Windows arm compiles nowhere, which is the
  # shape a `cfg` split fails in silently.
  #
  # **`clippy --lib` is the broad half and it is the important one.** It
  # type-checks and lints *every* line of the library for this target, which is
  # the only thing that can catch a `cfg(windows)` arm that does not compile —
  # a Linux `clippy --all-targets` never sees those arms at all, so `-D
  # warnings` there says nothing about them.
  #
  # **The test step is deliberately filtered, and that is a measured limitation
  # rather than an oversight.** An unfiltered `cargo test --lib` was run here
  # twice. With the runner's default `core.autocrlf=true` it is red at
  # **1388/1422**; with the `autocrlf=false` step above — which is the one that
  # counts — it is red at **1394/1422**, so six of those were pure CRLF against
  # the byte-exact goldens and are now fixed rather than excluded.
  #
  # Of the 28 that remain, **27 are Unix-shaped test fixtures rather than
  # defects**: `native::settings::tests` (10), `native::claude_settings` (9),
  # `native::fs::tests` (5), `native::scanner::walk` (2) and
  # `native::uploads::tests` (1) assert Unix path spellings —
  # `absolute_dir("/var/lib/claude")` is correctly `None` on Windows,
  # `validate_path_within_dir("/h/.claude/x", "/h/.claude")` is correctly
  # refused, `HOME=/home//u` correctly cleans to `\home\u`. The 28th is
  # `integrations::telegram::client::tests::a_body_that_dies_mid_stream_still_names_nothing_secret`,
  # which is a **stream-timing** difference and not a path fixture at all —
  # pre-existing, newly visible, and its own piece of work.
  #
  # Porting those is general Windows support, which #374 lists under *Risks* as
  # the scope creep to avoid, so the filter names the modules that issue owns:
  # `gopath` (both rule sets and both vector files, 248 cases against the real
  # target), the `sessions::projects` call site it fixed, and the Windows arm of
  # the profile path guard. **Widening this needs those fixtures ported first**
  # — see `CLAUDE.md`'s *Known gaps*.
  #
  # The integration suites under `src-tauri/tests/` are a different and harder
  # case: `chat_turn.rs`, `claude_sdk.rs` and `scheduled_run.rs` drive a fake
  # Claude CLI that is a shebang'd Python script made executable through
  # `std::os::unix::fs::PermissionsExt`, so they do not compile on Windows at
  # all. `--lib` is what excludes them.
  windows_rules:
    name: Windows unit tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # The runner's default is `core.autocrlf=true`, which rewrites every text
      # file on checkout — including `notifications/email.html` and the `parity/`
      # goldens, whose whole point is that they are byte-exact. Turning it off
      # here rather than adding a repository-wide `.gitattributes`: this is the
      # only Windows checkout there is, so the narrower lever is the right one.
      - name: Check out with the repository's own line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: windows

      # The frontend is not built here, so `tauri-build` has no `../dist` to
      # embed. It is only read in a release build, and this job compiles the
      # test profile — but the directory has to exist for the config to
      # validate.
      - name: Stub the frontend bundle
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html

      - name: Rust lints (windows arms)
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings

      # Three filters, not the whole lib — see the comment above the job.
      #
      # **The floor is not decoration.** `cargo test` treats "the filter matched
      # nothing" as **success**, so an allowlist that goes stale — a module
      # renamed, a test moved — would leave the only job that runs these rules
      # on Windows green with zero assertions executed. That is the same shape
      # as a vector loop with no truncation floor, and the same shape as the
      # allowlist `base.css` was rewritten away from in #469. Denylisting was
      # the alternative and is worse here: it would have to name ~30 individual
      # Unix-shaped fixtures, and each stale entry is itself invisible.
      - name: Rust unit tests (the Windows path rules and their call sites)
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          cargo test --lib -- \
            native::gopath \
            native::sessions::projects \
            native::claude_settings::profiles::tests::a_windows_path_outside_the_dir_is_refused \
            | tee filtered.log
          passed=$(grep -oE '^test result: ok\. [0-9]+ passed' filtered.log | grep -oE '[0-9]+' | head -1)
          echo "ran ${passed:-0} tests"
          if [ -z "$passed" ] || [ "$passed" -lt 25 ]; then
            echo "::error::expected at least 25 tests to run, got ${passed:-0} — the filter has gone stale"
            exit 1
          fi
