name: Release

# Builds the native installers for Agento and publishes the update manifest
# the in-app updater reads.
#
# Tauri cannot cross-compile its bundles: a .dmg needs macOS, an .exe needs
# Windows, a .deb needs Linux. So the matrix is one runner per target OS.
#
# Tag with `v1.0.0` on `main` to build.
#
# The `desktop-v*` prefix this used to require is gone: Agento is the desktop
# app and there is no second thing to disambiguate it from. The Go server that
# owned the plain `v*` namespace was sunset at `v0.11.2`, so `v1.0.0` and
# everything after it is unambiguously this app — and being greater than every
# legacy tag, it also takes over the repo's "Latest release" link.
#
# `desktop-latest` is a DIFFERENT thing and does NOT move. It is the fixed tag
# the update manifest is published to, and its URL is baked into every
# installer ever shipped (`plugins.updater.endpoints` in tauri.conf.json).
# Renaming it would silently strand every existing install: they would go on
# polling a URL that 404s and simply never be offered another update. The
# release tags are free to change; this one is not.
#
# One consequence of the shorter prefix, since `promote` keys off it: the 15
# legacy Go releases (`v0.1.0` … `v0.11.2`) now match it too. Re-publishing one
# of those would run `promote` against a release that has no manifest, which is
# why the download step names that case explicitly rather than failing on a
# bare 404.
#
# The flow has a deliberate human gate in the middle:
#
#   tag push        -> guard + build matrix -> DRAFT release with installers
#                      and `latest.json` staged as one of its assets. Draft
#                      assets are not publicly downloadable, so nothing has
#                      shipped yet — installed apps cannot even fetch it.
#   publish draft   -> the `release: published` event runs `promote`, which
#                      copies the staged `latest.json` to the fixed
#                      `desktop-latest` tag. That URL is what every installed
#                      app polls, so THIS is the moment a release goes live.
#
# Publishing the manifest immediately at build time would point updaters at
# draft asset URLs that 404 until someone remembers to publish the draft —
# every installed app would see "update available" and fail the download.
#
# A prerelease tag (`v1.0.0-rc.1`) builds and drafts identically and is
# auto-marked prerelease, but is never promoted: release candidates are
# shareable from the versioned release page without being pushed to updaters.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build installers without creating a release"
        type: boolean
        default: true
  release:
    types: [published]

# The event name is part of the group so publishing a draft (a `release`
# event carrying the same tag ref) can never cancel a build run in flight.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # The installed app compares the version baked into it at build time (from
  # tauri.conf.json) against the manifest's version (taken from the tag). If
  # the tag says 0.1.1 but the conf still says 0.1.0, every "updated" install
  # keeps reporting 0.1.0 and is re-offered the same update forever — so a
  # mismatched tag must never reach the build matrix.
  guard:
    name: Tag matches every version string
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Check the tag against every version string
        # `tauri.conf.json` is the one that decides what ships: the bundler
        # bakes it into the installer and the updater compares it against the
        # manifest, so a mismatch there makes every "updated" install re-offer
        # itself forever. That is why it was checked first and alone.
        #
        # The others are checked because nothing else ever looks at them.
        # `package-lock.json` sat on 0.1.1 for the whole of 0.1.2 for exactly
        # that reason, and a stale lockfile version is not merely untidy: npm
        # repairs that field on almost any command, so every fresh checkout goes
        # dirty on the first `npm run build` with a change nobody made — which
        # reads as local work, invites a discard, and comes back immediately.
        # `src-tauri/Cargo.toml` was the next one nobody was looking at: it sat
        # on 0.1.2 while the release became 1.0.0, and cargo never repairs it,
        # so the drift is silent rather than merely annoying.
        env:
          # `ref_type`, not the name's prefix. A `workflow_dispatch` run carries
          # the branch in GITHUB_REF_NAME, and now that the prefix is one letter
          # a branch called `validate-something` would be read as the tag
          # `alidate-something`. Asking what the ref *is* cannot be fooled that
          # way; the `v*` case below is then belt-and-braces.
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "not a tag build; nothing to check"
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "not a v* tag build; nothing to check"; exit 0 ;;
          esac
          tag_version="${tag#v}"

          conf_version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          pkg_version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          lock_version="$(python3 -c 'import json; print(json.load(open("package-lock.json"))["version"])')"
          lock_pkg_version="$(python3 -c 'import json; print(json.load(open("package-lock.json"))["packages"][""]["version"])')"
          # See ci.yml for why this is grep and not a TOML parser.
          cargo_toml_version="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"

          fail=0
          check() {
            if [ "$2" != "$tag_version" ]; then
              echo "::error::tag ${tag} says ${tag_version} but $1 says $2"
              fail=1
            fi
          }

          # The lockfile carries the version twice and npm keeps both in step,
          # so both are checked: a hand-edit that fixes only the top one leaves
          # the tree still dirty on the next npm command.
          check "src-tauri/tauri.conf.json"          "$conf_version"
          check "package.json"                       "$pkg_version"
          check "package-lock.json .version"         "$lock_version"
          check "package-lock.json .packages[''] "   "$lock_pkg_version"
          check "src-tauri/Cargo.toml"               "$cargo_toml_version"

          if [ "$fail" = 1 ]; then
            echo "::error::Fix with: npm version ${tag_version} --no-git-tag-version (package.json + lockfile), set src-tauri/tauri.conf.json and src-tauri/Cargo.toml by hand, then \`cargo update -p agento --offline\` for Cargo.lock. Then re-tag. See docs/releasing.md step 1."
            exit 1
          fi
          echo "ok: ${tag_version} in all five places"

  build:
    name: ${{ matrix.label }}
    needs: guard
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Native ARM runners are free for public repositories, so this needs
          # no cross-compilation or emulation.
          - label: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          # macos-15 is Apple Silicon, macos-15-intel is Intel. Both ship: a
          # universal binary would be simpler but doubles every download.
          # A job naming a retired image (macos-13 was one) queues forever
          # rather than erroring — check actions/runner-images before bumping.
          - label: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Ubuntu 22.04 carries webkit2gtk-4.1, which Tauri 2 requires. The .deb
      # links against whatever the build host has, so building on the oldest
      # supported LTS is what keeps the package installable on newer ones.
      # runner.os, not a matrix.os comparison: the arm64 runner is
      # `ubuntu-22.04-arm`, which a string equality on `ubuntu-22.04` silently
      # skipped — gdk-sys then failed against a runner with no GTK headers.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          # The Azure apt mirror has outages long enough to eat a whole step
          # timeout in retries; drop it so apt goes straight to the canonical
          # archive (or ports, on arm64).
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com|https://archive.ubuntu.com|g; s|https?://azure\.ports\.ubuntu\.com|http://ports.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update
          # xdg-utils: the AppImage bundler copies /usr/bin/xdg-open into the
          # bundle; the x86_64 runner image ships it, the arm64 one does not.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential patchelf file xdg-utils

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # What `GET /api/version` reports, and so what the About screen shows.
      # It is NOT what the updater compares — that reads the version baked
      # into tauri.conf.json by the bundler, which the guard job already pins
      # to the tag. These three are a separate, purely informational stamp
      # that nothing set until now, which is why every release through
      # desktop-v0.1.1 displayed "dev · unknown".
      #
      # Kept out of the `env:` block below so a dry run can name itself: a
      # workflow_dispatch has no tag, and stamping a dispatch build with the
      # conf version would make it indistinguishable from the real release.
      - name: Compute the build stamp
        id: stamp
        shell: bash
        env:
          # Same reasoning as the guard job: ask what the ref is, rather than
          # what its name starts with. Getting this wrong here is quieter —
          # a dispatch build from a `v…` branch would stamp itself as a
          # release version instead of `-dev`, and nothing would say so.
          REF_TYPE: ${{ github.ref_type }}
        run: |
          case "${REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')-dev" ;;
          esac
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          # RFC 3339, which is what the About screen's dateTime() parses.
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"
          echo "stamping ${version}"

      # bundle.targets in tauri.conf.json lists exactly what ships — notably
      # NSIS and not MSI on Windows, since the updater manifest expects the
      # -setup.exe and a built-but-dropped .msi only wasted CI time.
      - name: Build installers
        run: npx tauri build --target ${{ matrix.target }}
        env:
          # Read by src-tauri/build.rs, which re-emits them as rustc-env so a
          # restored rust-cache cannot ship the previous tag's stamp.
          AGENTO_BUILD_VERSION: ${{ steps.stamp.outputs.version }}
          AGENTO_BUILD_COMMIT: ${{ github.sha }}
          AGENTO_BUILD_DATE: ${{ steps.stamp.outputs.date }}
          # Signs the updater artifacts. This is Tauri's own minisign key, not
          # an Apple or Microsoft certificate — it only proves an update came
          # from us. Without it the build still succeeds but produces no .sig,
          # and the manifest job will fail loudly rather than ship unverifiable
          # updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # `bundle.macOS.signingIdentity` is `-` (ad-hoc), which is what makes a
      # quarantined Apple Silicon download launchable at all: Apple's linker
      # force-signs every arm64 executable ad-hoc anyway, but that signature
      # seals no resources, and Gatekeeper calls a bundle with an invalid seal
      # "damaged" — a verdict that deliberately has no Open Anyway override.
      # This step exists because losing the seal is invisible everywhere else:
      # an un-quarantined app (CI, a local build) launches fine either way, so
      # only a downloader would ever notice, which is exactly how v1.0.0
      # shipped unlaunchable on every Mac sold since 2020.
      #
      # It checks all three artifacts rather than only the .app the bundler
      # signs first. The .app is not what anyone receives: a downloader opens
      # the .dmg and the updater consumes Agento.app.tar.gz, and each is
      # re-derived by third-party code (hdiutil, a tar writer) whose symlink
      # and permission handling this repo does not control across CLI
      # upgrades. Verifying only the pre-derivation copy would reproduce the
      # exact blind spot this step exists to close.
      - name: Verify the macOS bundles are sealed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          base="src-tauri/target/${{ matrix.target }}/release/bundle"

          # `codesign --verify` passes on the linker's executable-only
          # signature too, so the resource seal needs its own assertion:
          # CodeResources is the file only a real `codesign` run over a whole
          # bundle produces. The --display comes first, so the log carries
          # "Sealed Resources ... files=N" (and `flags=`) in the failing case
          # too — with `bash -eo pipefail` a trailing diagnostic would only
          # ever print when nothing was wrong.
          assert_sealed() {
            echo "── $1"
            codesign --display --verbose=4 "$1" || true
            codesign --verify --deep --strict --verbose=2 "$1"
            test -f "$1/Contents/_CodeSignature/CodeResources"
          }

          # `find` itself exits non-zero on a missing directory, which under
          # `-e` would abort before the friendly message — so test the path
          # first. A moved bundle dir is the realistic regression here.
          test -d "$base/macos" || {
            echo "::error::no macos bundle dir for ${{ matrix.target }}"
            exit 1
          }

          app=$(find "$base/macos" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$app" ]; then
            echo "::error::no .app bundle found for ${{ matrix.target }}"
            exit 1
          fi
          assert_sealed "$app"

          # The .dmg a user downloads.
          shopt -s nullglob
          dmgs=("$base/dmg"/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::no .dmg built for ${{ matrix.target }}"
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            mnt=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            mounted=$(find "$mnt" -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$mounted" ]; then
              hdiutil detach "$mnt" || true
              echo "::error::no .app inside $dmg"
              exit 1
            fi
            assert_sealed "$mounted"
            # Tolerated: a detach that loses a race leaves a stale mount on a
            # throwaway runner, which is not worth failing a release over.
            hdiutil detach "$mnt" || true
          done

          # The updater payload, which is what every installed app swaps in.
          # Found rather than globbed at a fixed path, so a bundler that moves
          # it fails the `-eq 0` check below instead of being silently skipped.
          # Read -print0 rather than `$(find …)`: an unquoted command
          # substitution word-splits, which would turn one moved path into
          # several fragments and slip straight past that `-eq 0` check.
          # A `read -d ''` loop rather than `mapfile`, because the macOS
          # runners' `bash` is 3.2 — `mapfile` is a bash 4 builtin and this
          # step failed with `mapfile: command not found` on both macOS legs.
          tarballs=()
          while IFS= read -r -d '' found; do
            tarballs+=("$found")
          done < <(find "$base" -type f -name '*.app.tar.gz' -print0)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::no .app.tar.gz built for ${{ matrix.target }}"
            exit 1
          fi
          for tarball in "${tarballs[@]}"; do
            tmp=$(mktemp -d)
            tar -xzf "$tarball" -C "$tmp"
            extracted=$(find "$tmp" -maxdepth 1 -name '*.app' | head -1)
            if [ -z "$extracted" ]; then
              echo "::error::no .app inside $tarball"
              exit 1
            fi
            assert_sealed "$extracted"
          done

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          base="src-tauri/target/${{ matrix.target }}/release/bundle"
          # Installers users download, plus the updater payloads and their
          # signatures. macOS updates ship as .app.tar.gz, not as the .dmg.
          find "$base" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*-setup.exe' \
               -o -name '*.app.tar.gz' -o -name '*.sig' \) \
            -exec cp {} out/ \;
          # Tauri names the macOS updater tarball Agento.app.tar.gz with no
          # arch — identical on both macOS legs, so the release job's merged
          # artifact download would silently overwrite one arch's payload
          # with the other's. Rename to the arch-suffixed form the manifest
          # script keys platforms by.
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) suffix=aarch64 ;;
            x86_64-apple-darwin)  suffix=x64 ;;
            *)                    suffix= ;;
          esac
          if [ -n "$suffix" ] && [ -f out/Agento.app.tar.gz ]; then
            mv out/Agento.app.tar.gz "out/Agento_${suffix}.app.tar.gz"
            mv out/Agento.app.tar.gz.sig "out/Agento_${suffix}.app.tar.gz.sig"
          fi
          ls -lh out

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: agento-desktop-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Release metadata
        id: meta
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A prerelease suffix (v1.0.0-rc.1) marks the draft as a prerelease,
          # which is one of the two things keeping `promote` from ever pushing
          # it to updaters.
          case "$version" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac

      - name: Build update manifest
        run: |
          python3 .github/scripts/build-update-manifest.py \
            --artifacts artifacts \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --output artifacts/latest.json
          cat artifacts/latest.json

      # The versioned release: what people download. It is a DRAFT — a human
      # vets the installers before anything ships, and draft assets are not
      # publicly downloadable. That is also why latest.json is only STAGED
      # here rather than published to desktop-latest now: a live manifest
      # pointing at draft asset URLs would make every installed app report an
      # update it cannot download. Publishing this draft fires `promote`.
      - name: Publish draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*-setup.exe
            artifacts/*.app.tar.gz
            artifacts/*.sig
            artifacts/latest.json
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Desktop builds of Agento.

            | Platform | File | Updates |
            |---|---|---|
            | Linux (any distro) | `.AppImage` | automatic, in-app |
            | Debian / Ubuntu | `.deb` | via apt — the app notifies |
            | Fedora / RHEL | `.rpm` | via dnf — the app notifies |
            | macOS | `.dmg` (Apple Silicon and Intel) | automatic, in-app |
            | Windows | `-setup.exe` | automatic, in-app |

            macOS builds are ad-hoc signed but **not notarised**. On first
            launch macOS says it cannot verify the developer: open
            **System Settings → Privacy & Security** and choose
            **Open Anyway**. That is a one-time step — updates the app
            installs itself never ask again.

            Requires the Claude Code CLI to be installed and signed in.

  # Runs when a human publishes the draft. Promotion, not regeneration: the
  # manifest was built and signed beside the artifacts it points at, and this
  # job only copies it to the fixed URL the updater polls. The `if` filters
  # out everything else that flows through `release: published` —
  # desktop-latest's own publication (which does not start with `v`), and any
  # release marked prerelease; the version check below catches an rc tag even
  # if someone unticked the prerelease box before publishing.
  promote:
    name: Promote update manifest
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the staged manifest
        run: |
          version="${TAG#v}"
          case "$version" in
            *-*)
              echo "::error::${TAG} is a prerelease tag published without the prerelease flag; refusing to promote it to desktop-latest."
              exit 1
              ;;
          esac

          # The `v*` prefix also matches the 15 releases the sunset Go server
          # left behind (v0.1.0 … v0.11.2). Re-publishing one of those reaches
          # this job, and it has no manifest to promote — say so, rather than
          # letting `gh release download` fail on a bare "asset not found" that
          # reads like the build broke.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --json assets --jq '.assets[].name' | grep -qx latest.json; then
            echo "::error::${TAG} carries no latest.json, so there is nothing to promote. Every release built by this workflow stages one; a tag without it is either a legacy Go-server release (v0.1.0 through v0.11.2) or a release whose assets were edited by hand."
            exit 1
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --output latest.json
          python3 - "$version" <<'EOF'
          import json, sys
          version = sys.argv[1]
          manifest = json.load(open("latest.json"))
          if manifest["version"] != version:
              sys.exit(f"staged manifest says {manifest['version']!r}, tag says {version!r}")
          print(f"promoting {version}: {', '.join(sorted(manifest['platforms']))}")
          EOF

      # A fixed tag so the updater has a stable manifest URL. Marked as a
      # prerelease so it never displaces the real "Latest release" on the repo
      # page — asset download URLs work for prereleases just the same.
      #
      # The name is `desktop-latest` and must stay that way even though the
      # release tags dropped the prefix: this exact URL is compiled into every
      # installer that has ever shipped, and an app polling a 404 is never
      # offered an update and never reports a problem.
      - name: Publish to desktop-latest
        run: |
          if ! gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create desktop-latest --repo "$GITHUB_REPOSITORY" \
              --prerelease --title "Desktop update manifest" \
              --notes "Machine-readable manifest the Agento desktop updater polls.
          Not a download — see the \`v*\` releases for installers."
          fi
          gh release upload desktop-latest latest.json --clobber --repo "$GITHUB_REPOSITORY"
