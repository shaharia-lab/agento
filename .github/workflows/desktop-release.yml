name: Desktop Release

# Builds the native installers for the Tauri desktop app.
#
# Tauri cannot cross-compile its bundles: a .dmg needs macOS, an .msi needs
# Windows, a .deb needs Linux. So the matrix is one runner per target OS.
# The Go sidecar is the opposite — it is pure Go (modernc.org/sqlite, no CGO),
# so each runner cross-compiles its own sidecar with no extra toolchain.

# Releases are cut from the `desktop` branch, not `main`, until the two merge.
# Tag with `desktop-v0.1.0` on `desktop` to publish.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build installers without creating a release"
        type: boolean
        default: true

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - label: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - label: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      # Ubuntu 22.04 carries webkit2gtk-4.1, which Tauri 2 requires. The .deb
      # links against whatever the build host has, so building on the oldest
      # supported LTS is what keeps the package installable on newer ones.
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential patchelf file

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      # Must precede the Tauri build: `externalBin` resolves the sidecar by
      # filename at bundle time and fails the build if it is absent.
      - name: Build Go sidecar
        working-directory: desktop
        shell: bash
        run: ./scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Build installers
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }}
        env:
          # Signing is opt-in: forks and dry runs build unsigned rather than
          # failing on absent secrets.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          base="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$base" -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: agento-desktop-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            Desktop builds of Agento.

            | Platform | File |
            |---|---|
            | Debian / Ubuntu | `.deb` |
            | Fedora / RHEL | `.rpm` |
            | Other Linux | `.AppImage` |
            | macOS | `.dmg` (Apple Silicon and Intel) |
            | Windows | `.msi` or `-setup.exe` |

            **Requires the Claude Code CLI** to be installed and signed in —
            the app runs your agents through it. See the README.
