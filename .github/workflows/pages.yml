name: Site

# Publishes the documentation and blog site to GitHub Pages.
#
# It runs on a release as well as on a push, and that is not redundant: the
# landing page bakes in the latest release's version and its per-platform
# installer URLs (web/scripts/fetch-release.mjs), because asset filenames carry
# the version and so cannot be addressed by GitHub's `releases/latest/download`
# redirect. Without the release trigger the site would advertise the previous
# version until somebody happened to push a docs change.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
      - 'src-tauri/tauri.conf.json'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

# Every action is pinned to a full commit SHA, and only GitHub-owned actions are
# used. Both are policy on this organisation: `sha_pinning_required` is on, and
# `allowed_actions` is a selected allowlist. A workflow that breaks either fails
# at startup with "This run likely failed because of a workflow file issue" and
# no job logs, which is a slow thing to diagnose — so check the policy before
# adding an action here.
#
# **Pinning this file is not enough — the rule applies transitively.** A
# composite action's own `uses:` lines are resolved on the runner and checked
# against the same policy, so a composite that references its dependency by tag
# is refused however carefully we pinned the composite itself. That is what
# broke the first deploy: `upload-pages-artifact@v3` calls
# `actions/upload-artifact@v4` by tag, and the run failed at "Getting action
# download info" with "The action actions/upload-artifact@v4 is not allowed" —
# naming an action that appears nowhere in this file. All three Pages actions
# are on versions that SHA-pin their own dependencies; check `action.yml` at the
# tag before bumping any of them.

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run is superseded rather than racing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        # The token lifts the release API's unauthenticated rate limit. The
        # build falls back to the version in tauri.conf.json without it, so a
        # rate limit degrades the download list rather than failing the run.
        #
        # PUBLIC_GTM_ID is a repository variable, not a secret — a container id
        # is visible in the page source of every site that loads one. Unset, the
        # build emits no analytics at all, which is what keeps the tag off fork
        # builds and off `npm run dev`; see gtmId() in web/site.config.mjs.
        # Only this workflow publishes, so only this workflow passes it: the
        # site-check job builds the same site without it deliberately.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
