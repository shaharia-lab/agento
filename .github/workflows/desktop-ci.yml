name: Desktop CI

# Checks for the Tauri desktop app. Until `desktop` merges into `main`, this is
# the integration branch: desktop PRs target it, and desktop releases are tagged
# from it.
#
# The app is the whole repository on this branch (#388), so there is no path
# filter left to write — the `desktop/**` prefix and the `go.mod`/`go.sum`/
# `internal/**` triggers (which existed so a change to the Go tree the app
# `include_str!`d still ran these checks) all named things that no longer
# exist. An unfiltered trigger is also the safer default now: with one tree
# there is no such thing as a change that cannot affect the app.

on:
  pull_request:
    branches: [desktop]
  push:
    branches: [desktop]
  workflow_dispatch:

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and build
    runs-on: ubuntu-22.04
    # A hung step otherwise runs until GitHub's 6-hour cap: apt has stalled on
    # a dead mirror socket twice (56 min and 3h42m of silence after
    # "Get:5 ... jammy-security InRelease"), burning runner time and blocking
    # the PR with a check that will never report.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install Linux build dependencies
        # Azure's mirror regularly fails over to archive.ubuntu.com, and a
        # stalled fetch there is the hang the timeouts above exist for — so
        # give apt its own tight deadline and per-request timeouts + retries,
        # which turn a dead mirror into a fast, retryable failure.
        timeout-minutes: 10
        run: |
          # When the Azure mirror is fully down, per-request timeouts alone
          # still blow the step deadline: 30s x 3 retries x dozens of index
          # files. Drop it from the mirror list so apt never contacts it.
          sudo sed -i -E 's|https?://azure\.archive\.ubuntu\.com|https://archive.ubuntu.com|g; s|https?://azure\.ports\.ubuntu\.com|http://ports.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          APT_OPTS='-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30'
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev \
            build-essential file

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build frontend
        run: npm run build

      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust lints
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Covers every endpoint, including the frozen goldens in parity/ — which
      # a Go suite used to assert from the other side and now nothing does, so
      # this is their only remaining reader (#388). The live-instance diff suites
      # went with the Go server they diffed against.
      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # A full `tauri build` here would double CI time; compiling the release
      # profile is what actually catches the `cfg(not(debug_assertions))` code
      # that never builds during development.
      - name: Compile Rust (release)
        working-directory: src-tauri
        run: cargo build --release
