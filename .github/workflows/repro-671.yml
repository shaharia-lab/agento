name: repro-671
on:
  push:
    branches: [repro/issue-671]
permissions:
  contents: read
jobs:
  repro:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os == 'windows-latest' && 'windows' || 'linux' }}
      - name: Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - name: Build the test binary
        shell: bash
        working-directory: src-tauri
        run: cargo test --lib --no-run
      - name: Original fixture, 20 runs
        shell: bash
        working-directory: src-tauri
        run: |
          pass=0; fail=0
          for i in $(seq 20); do
            if cargo test --lib -- repro_671_original_fixture --nocapture > out.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); fi
            grep -E "REPRO671|panicked|test result" out.log || true
          done
          echo "ORIGINAL pass=$pass fail=$fail"
      - name: Fixed fixture, 20 runs
        shell: bash
        working-directory: src-tauri
        run: |
          pass=0; fail=0
          for i in $(seq 20); do
            if cargo test --lib -- a_body_that_dies_mid_stream_still_names_nothing_secret --nocapture > out.log 2>&1; then pass=$((pass+1)); else fail=$((fail+1)); fi
            grep -E "REPRO671|panicked|test result" out.log || true
          done
          echo "FIXED pass=$pass fail=$fail"
          [ "$fail" -eq 0 ]
